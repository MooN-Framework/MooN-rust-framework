# Node-Config — pro Node eine Datei; nur `own_id` und ggf. `port`
# unterscheiden sich zwischen den Fabric-Nodes.
own_id = 2

[participants]
nominal          = 3
minimum          = 2
probation_cycles = 10

[timing]
cycle_duration_ms = 20

# In-Cycle Phase-Deadlines (Offsets ab Cycle-Anker).
# Strikt monoton wachsend, < cycle_duration_ms.
share_inputs_offset_ms  = 5
share_result_offset_ms  = 10
send_ack_offset_ms      = 14
crc_offset_ms           = 17

# Nicht-Cycle Phase-Timeouts (relativ zum Phaseneintritt).
init_sync_timeout_ms   = 2000
peer_sync_timeout_ms   = 500
cycle_sync_timeout_ms  = 10
error_mgmt_timeout_ms  = 20
state_sync_timeout_ms  = 500
resync_timeout_ms      = 5000

# Universelles Retransmit-Intervall fuer alle collect_phase-Loops.
# Muss < kleinster Timeout sein.
send_interval_ms       = 1

# Misc
stale_frame_threshold_ms = 50
resync_interval_cycles   = 500

[transport]
interface       = "lo"
multicast_group = "239.10.0.1"
port            = 5555

[diagnostic]
enabled         = true
interface       = "lo"
multicast_group = "239.10.0.2"
port            = 6666