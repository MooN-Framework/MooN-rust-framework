[pytest]
# Run scenarios in numeric order; more or less useful when reading logs.
testpaths = scenarios
python_files = test_t*.py
addopts = -v --tb=short --strict-markers
markers =
    slow: langsam, per default nicht ausgefuehrt (>30s)

# Damit `from harness.xxx import ...` in tests funktioniert.
pythonpath = .
