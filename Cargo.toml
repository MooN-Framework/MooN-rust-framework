[package]
name = "swb_fault_tolerance"
version = "0.1.0"
edition = "2024"

[dependencies]
if-addrs = "0.13"
crc32fast = "1.5.0"
socket2 = { version = "0.5.10", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.52.3"
heapless = "0.8"
